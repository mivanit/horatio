[project]
name = "dashboard"
version = "0.1.0"
description = "Homelab status dashboard"
requires-python = ">=3.10"
dependencies = [
    "glances[web]>=4.5.5",  # Web server mode (FastAPI, Uvicorn, Jinja2); >=4.5.5 for security fixes (2026-07)
    "nvidia-ml-py",         # NVIDIA GPU monitoring
    "httpx",                # Async HTTP client for API proxy
]

[tool.uv]
# Security floors for transitive deps (Dependabot alerts, 2026-07).
# These only constrain resolution; they don't add packages to the tree.
constraint-dependencies = [
    "fastapi>=0.133.0",      # earlier versions cap starlette <1.0, blocking its fixes
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
    "cryptography>=48.0.1",
    "ecdsa>=0.19.2",         # Minerva timing attack remains unfixed upstream (won't-fix)
    "pyasn1>=0.6.3",
    "idna>=3.15",
    "requests>=2.33.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff",
    "ty",
]

[tool.ruff.lint]
extend-select = ["ANN", "I"]
# JSON payloads and mock forwarding still need dynamic types.
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/installers", "tests/collector", "tests/frontend"]
addopts = "--import-mode=importlib --strict-markers -ra"
markers = ["integration: real dashboard and Glances HTTP tests"]
