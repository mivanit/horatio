name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  # pages.yml runs these before deploying the demo.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when pages.yml calls this, so that run
  # and this file's own run for the same push don't cancel each other.
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [check-format, typing, test-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.target == 'test-python'
        with:
          node-version: "22"
          package-manager-cache: false
      - run: make ${{ matrix.target }}

  native-lua:
    name: Native Lua history and API fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcrypt-dev curl git gzip tzdata patch
      - name: Build pinned Lua and Nixio
        run: sh scripts/setup-lua-tests.sh "$RUNNER_TEMP/horatio-native-lua"
      - name: Test native Lua behavior on Linux
        run: |
          LUA_CPATH="$RUNNER_TEMP/horatio-native-lua/luci/libs/luci-lib-nixio/src/?.so;;" \
            make test-lua LUA="$RUNNER_TEMP/horatio-native-lua/lua-5.1.5/src/lua"

  linux-lua-runtime:
    name: Lua HTTP runtime on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config curl ca-certificates libcrypt-dev
      - name: Build private Lua HTTP runtime
        run: sh scripts/setup-lua-runtime.sh "$RUNNER_TEMP/horatio-lua-runtime"
      - name: Exercise the real handler over HTTP
        run: LUA_RUNTIME="$RUNNER_TEMP/horatio-lua-runtime" uv run --locked pytest tests/lua/test_runtime.py

  systemd-install:
    name: ${{ matrix.backend }} installation under systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [python, lua]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the Python upgrade starts at the published v0.2.1 tag
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install deployment prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config curl ca-certificates libcrypt-dev wget smartmontools
      - name: Exercise installed services on the disposable runner
        env:
          HORATIO_SYSTEMD_TEST: "1"
          # Keep the interpreter under home, exercising ProtectHome and its bind.
          UV_PYTHON_INSTALL_DIR: /home/runner/.local/share/horatio-test-python
          UV_PYTHON_PREFERENCE: only-managed
        run: uv run --locked pytest -v tests/deployment/test_systemd.py -k '${{ matrix.backend }}'

  openwrt-container:
    name: OpenWrt ${{ matrix.scenario }} in a container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, migrate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # migration installs the actual published source first
      - run: scripts/openwrt-container-test.sh '${{ matrix.scenario }}'
